services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: campus_shuttle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_shuttle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - campus_shuttle_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: campus_shuttle_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: campus_shuttle_api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

volumes:
  campus_shuttle_pgdata:
